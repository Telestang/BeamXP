[tool.ruff.lint]
ignore = [
    "BLE001", # BeamNG assets, optional render backends, and cache reads use tolerant boundaries.
    "S110",   # Silent cleanup/cache failures are intentional in several UI and filesystem paths.
    "S112",   # Asset scans skip malformed optional entries instead of aborting whole vehicle loads.
]

[tool.ruff.lint.per-file-ignores]
"beamxp/hand_drive_core.py" = [
    "F401",    # Compatibility facade imports are intentionally re-exported.
    "I001",    # Import layout mirrors the former monolith wiring.
    "PLE0605", # __all__ is built dynamically after facade wiring.
]
"beamxp/hand_drive_tool.py" = [
    "F401",    # Legacy entrypoint re-exports selected internals.
    "I001",
    "PLE0605", # __all__ is generated from globals for compatibility.
]
"beamxp/hand_drive_parts/*.py" = [
    "F401",  # Extracted slices keep broad imports from the former monolith.
    "F821",  # Extracted slices receive shared symbols from hand_drive_core wiring.
    "I001",
    "RUF022", # __all__ ordering is generated by the extraction workflow.
]
